    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Placetrace Solutions",
      "url": "https://placetrace.com",
      "logo": "https://placetrace.com/logo.png",

        "streetAddress": "Schmerberger Weg 88f",
        "addressLocality": "Schwielowsee OT Caputh",
        "postalCode": "14548",
        "addressCountry": "DE"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+49-176-726-38-087",
        "contactType": "sales",
        "availableLanguage": "German"
      },
      "sameAs": []
    }
    </script>

    <!-- GitHub Pages SPA redirect handler -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>

  <body>
    <!-- Hidden form for Netlify Forms detection -->
    <form name="contact" data-netlify="true" data-netlify-honeypot="bot-field" hidden>

    <!-- Hidden form for Pain Points Lead capture -->
    <form name="pain-points-lead" data-netlify="true" data-netlify-honeypot="bot-field" hidden>

      <input type="tel" name="phone" />

    </form>
