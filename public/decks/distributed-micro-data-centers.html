  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\" rx=\"800\" ry=\"210\" fill=\"url(#cloudGlow)\" opacity=\"0.9\"><\u002Fellipse>\n\n      <g id=\"orchestration\"><\u002Fg>\n\n      <ellipse cx=\"820\" cy=\"900\" rx=\"780\" ry=\"220\" fill=\"url(#groundDisc)\"><\u002Fellipse>\n      <ellipse cx=\"820\" cy=\"900\" rx=\"640\" ry=\"170\" fill=\"none\" stroke=\"#22304f\" stroke-width=\"1\" stroke-dasharray=\"2 8\" opacity=\"0.7\"><\u002Fellipse>\n\n      <g id=\"neighborhood\"><\u002Fg>\n      <g id=\"streams\"><\u002Fg>\n      <g id=\"operator\"><\u002Fg>\n      <g id=\"thick-conn\"><\u002Fg>\n    <\u002Fsvg>\n\n    <div class=\"legend\">\n      <div class=\"item\"><span class=\"arr\" style=\"color:#22d3ee\">▲<\u002Fspan>Telemetry up<\u002Fdiv>\n      <div class=\"item\"><span class=\"arr\" style=\"color:#bcd9a4\">▼<\u002Fspan>Jobs down<\u002Fdiv>\n      <div class=\"item\"><span class=\"sw\" style=\"background:#67e8f9;color:#67e8f9;opacity:0.7\"><\u002Fspan>Cooling airflow<\u002Fdiv>\n      <div class=\"item\"><span class=\"sw\" style=\"background:#34d399;color:#34d399\"><\u002Fspan>Node online<\u002Fdiv>\n      <div class=\"item\"><span class=\"sw\" style=\"background:#facc15;color:#facc15\"><\u002Fspan>Power / EV<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"footer-meta\">\n      <span class=\"place\">Potsdam<\u002Fspan> · Cluster site 03<br>\n      <span class=\"nodes\">12 active nodes<\u002Fspan> · 120 GPUs\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n  function fit() {\n    const w = window.innerWidth, h = window.innerHeight;\n    const s = Math.min(w / 1920, h / 1080);\n    document.getElementById('stage').style.transform = `scale(${s})`;\n  }\n  window.addEventListener('resize', fit);\n  fit();\n<\u002Fscript>\n\n<script>\n/* Placetrace — Distributed Micro Data Centers (Potsdam edition)\n   Coordinate system: world (x, y, z); +x → bottom-right, +y → bottom-left, +z → up.\n   Projection: sx = (x - y) * 0.866 * S; sy = ((x + y) * 0.5 - z) * S.\n*/\n\n(function () {\n  const NS = 'http://www.w3.org/2000/svg';\n  const svg = document.getElementById('scene');\n  const gNeigh = document.getElementById('neighborhood');\n  const gStreams = document.getElementById('streams');\n  const gOrch = document.getElementById('orchestration');\n  const gOp = document.getElementById('operator');\n  const gThick = document.getElementById('thick-conn');\n\n  const S = 26;\n  const ORIGIN = { x: 880, y: 760 };\n  const PT_GREEN = '#bcd9a4';\n  const PT_GREEN_DARK = '#7a9a64';\n\n  function iso(x, y, z = 0) {\n    return {\n      x: ORIGIN.x + (x - y) * 0.866 * S,\n      y: ORIGIN.y + ((x + y) * 0.5 - z) * S,\n    };\n  }\n  function el(tag, attrs = {}, parent) {\n    const n = document.createElementNS(NS, tag);\n    for (const k in attrs) n.setAttribute(k, attrs[k]);\n    if (parent) parent.appendChild(n);\n    return n;\n  }\n  function poly(pts, fill, parent, extra = {}) {\n    return el('polygon', {\n      points: pts.map(p => `${p.x.toFixed(2)},${p.y.toFixed(2)}`).join(' '),\n      fill, ...extra\n    }, parent);\n  }\n  function shade(hex, amt) {\n    const c = hex.replace('#', '');\n    const r = parseInt(c.substr(0, 2), 16);\n    const g = parseInt(c.substr(2, 2), 16);\n    const b = parseInt(c.substr(4, 2), 16);\n    const f = v => Math.max(0, Math.min(255, Math.round(v + 255 * amt)));\n    return `#${[f(r), f(g), f(b)].map(v => v.toString(16).padStart(2, '0')).join('')}`;\n  }\n\n  // ----- Box (top, +x face, +y face) -----\n  function box(g, x, y, z, w, d, h, c) {\n    c = c || {};\n    const t = c.top || '#cfd6e2', r = c.right || '#9aa3b5', l = c.left || '#bcc4d4';\n    const stroke = c.stroke || 'rgba(8,12,22,0.45)';\n    const sw = c.sw != null ? c.sw : 0.6;\n    const p = (X, Y, Z) => iso(X, Y, Z);\n    poly([p(x, y, z + h), p(x + w, y, z + h), p(x + w, y + d, z + h), p(x, y + d, z + h)], t, g, { stroke, 'stroke-width': sw, 'stroke-linejoin': 'round' });\n    poly([p(x + w, y, z + h), p(x + w, y, z), p(x + w, y + d, z), p(x + w, y + d, z + h)], r, g, { stroke, 'stroke-width': sw, 'stroke-linejoin': 'round' });\n    poly([p(x + w, y + d, z + h), p(x + w, y + d, z), p(x, y + d, z), p(x, y + d, z + h)], l, g, { stroke, 'stroke-width': sw, 'stroke-linejoin': 'round' });\n  }\n\n  // ----- Gable roof along x-axis -----\n  function gableRoof(g, x, y, z, w, d, h, c) {\n    c = c || {};\n    const fill = c.fill || 'url(#roofSlate)';\n    const dark = c.dark || '#252b3a';\n    const stroke = c.stroke || 'rgba(8,12,22,0.55)';\n    const p = (X, Y, Z) => iso(X, Y, Z);\n    const L1 = p(x, y, z), L2 = p(x + w, y, z);\n    const L3 = p(x + w, y + d, z), L4 = p(x, y + d, z);\n    const R1 = p(x, y + d / 2, z + h);\n    const R2 = p(x + w, y + d / 2, z + h);\n    poly([L1, L2, R2, R1], dark, g, { stroke, 'stroke-width': 0.6, 'stroke-linejoin': 'round' });\n    poly([R1, R2, L3, L4], fill, g, { stroke, 'stroke-width': 0.6, 'stroke-linejoin': 'round' });\n    poly([L2, L3, R2], c.gable || '#d6cdb9', g, { stroke, 'stroke-width': 0.6 });\n  }\n\n  // ----- Mansard roof: trapezoid front face plus small top -----\n  function mansardRoof(g, x, y, z, w, d, h, c) {\n    c = c || {};\n    const fill = c.fill || 'url(#roofDark)';\n    const dark = c.dark || '#181c26';\n    const stroke = c.stroke || 'rgba(6,10,18,0.6)';\n    const p = (X, Y, Z) => iso(X, Y, Z);\n    const inset = 0.35;\n    // Bottom (eaves) corners\n    const B1 = p(x, y, z), B2 = p(x + w, y, z), B3 = p(x + w, y + d, z), B4 = p(x, y + d, z);\n    // Top (flat) corners\n    const T1 = p(x + inset, y + inset, z + h);\n    const T2 = p(x + w - inset, y + inset, z + h);\n    const T3 = p(x + w - inset, y + d - inset, z + h);\n    const T4 = p(x + inset, y + d - inset, z + h);\n    // back slope (faces -y, hidden / dark)\n    poly([B1, B2, T2, T1], dark, g, { stroke, 'stroke-width': 0.5 });\n    // front slope (max-y)\n    poly([T1, T2, T3, T4].length === 4 ? [T4, T3, B3, B4] : [], '', g);\n    poly([T4, T3, B3, B4], fill, g, { stroke, 'stroke-width': 0.5 });\n    // right slope (max-x)\n    poly([T2, B2, B3, T3], shade('#3a3f4c', -0.05), g, { stroke, 'stroke-width': 0.5 });\n    // top flat (small)\n    poly([T1, T2, T3, T4], shade('#3a3f4c', -0.1), g, { stroke, 'stroke-width': 0.5 });\n    // dormer hint: tiny attic window on front\n    const dwc = iso(x + w * 0.5, y + d - 0.05, z + h * 0.45);\n    el('rect', { x: dwc.x - 6, y: dwc.y - 5, width: 12, height: 8, rx: 1.5, fill: '#3a4d6b', stroke: '#cfc4ad', 'stroke-width': 0.4 }, g);\n  }\n\n  // ----- Window (single rect on a face) -----\n  function drawWindow(g, x, y, z, ww, hh, face, opts = {}) {\n    let pts;\n    if (face === 'maxy') {\n      pts = [iso(x, y, z), iso(x + ww, y, z), iso(x + ww, y, z + hh), iso(x, y, z + hh)];\n    } else {\n      pts = [iso(x, y, z), iso(x, y + ww, z), iso(x, y + ww, z + hh), iso(x, y, z + hh)];\n    }\n    const glass = opts.glass || '#3a4d6b';\n    const frame = opts.frame || 'rgba(20,28,44,0.6)';\n    poly(pts, glass, g, { stroke: frame, 'stroke-width': 0.4 });\n    // warm inner highlight on top half (one in N)\n    if (opts.lit) {\n      let pts2;\n      const inset = 0.08;\n      if (face === 'maxy') {\n        pts2 = [\n          iso(x + inset, y, z + hh * 0.55),\n          iso(x + ww - inset, y, z + hh * 0.55),\n          iso(x + ww - inset, y, z + hh - inset),\n          iso(x + inset, y, z + hh - inset),\n        ];\n      } else {\n        pts2 = [\n          iso(x, y + inset, z + hh * 0.55),\n          iso(x, y + ww - inset, z + hh * 0.55),\n          iso(x, y + ww - inset, z + hh - inset),\n          iso(x, y + inset, z + hh - inset),\n        ];\n      }\n      poly(pts2, '#f3d88a', g, { opacity: 0.75 });\n    }\n  }\n\n  // ----- Belt cornice (a thin band wrap) -----\n  function cornice(g, x, y, z, w, d, h, color) {\n    box(g, x - 0.05, y - 0.05, z, w + 0.1, d + 0.1, h, {\n      top: shade(color, 0.08), right: shade(color, -0.1), left: shade(color, -0.02), sw: 0.4,\n    });\n  }\n\n  // ----- Solar panel array on flat top -----\n  function solarArray(g, x, y, z, w, d) {\n    const p = (X, Y, Z) => iso(X, Y, Z);\n    poly([p(x, y, z), p(x + w, y, z), p(x + w, y + d, z), p(x, y + d, z)],\n      'url(#solarPattern)', g, { stroke: '#1e3a8a', 'stroke-width': 0.4 });\n  }\n\n  // ----- Tree -----\n  function tree(g, x, y, sc = 1) {\n    const t = iso(x, y, 0), c = iso(x, y, 1.6 * sc);\n    el('rect', { x: t.x - 1.5, y: t.y - 14 * sc, width: 3, height: 14 * sc, fill: '#4a3526', rx: 1 }, g);\n    el('ellipse', { cx: c.x, cy: c.y - 4, rx: 10 * sc, ry: 8 * sc, fill: '#3f6b3f', stroke: '#2c4d2c', 'stroke-width': 0.5 }, g);\n    el('ellipse', { cx: c.x - 3, cy: c.y - 6, rx: 5 * sc, ry: 4 * sc, fill: '#588a58', opacity: 0.7 }, g);\n  }\n\n  // ----- Car -----\n  function car(g, x, y, rot, color = '#cf3a3a') {\n    const w = rot === 'x' ? 1.6 : 0.8;\n    const d = rot === 'x' ? 0.8 : 1.6;\n    box(g, x, y, 0, w, d, 0.4, { top: color, right: shade(color, -0.15), left: shade(color, -0.08), sw: 0.4 });\n    box(g, x + (rot === 'x' ? 0.35 : 0.05), y + (rot === 'x' ? 0.05 : 0.35), 0.4,\n      rot === 'x' ? 0.9 : 0.7, rot === 'x' ? 0.7 : 0.9, 0.35,\n      { top: shade(color, -0.25), right: shade(color, -0.35), left: shade(color, -0.3), sw: 0.4 });\n  }\n\n  // ----- EV charger -----\n  function evCharger(g, x, y) {\n    box(g, x, y, 0, 0.3, 0.3, 1.3, { top: '#1f2937', right: '#374151', left: '#2b3445', sw: 0.4 });\n    const s = iso(x + 0.31, y + 0.15, 1.0);\n    el('rect', { x: s.x - 2, y: s.y - 9, width: 6, height: 9, fill: '#22d3ee', opacity: 0.85, rx: 1, filter: 'url(#softGlow)' }, g);\n    const l = iso(x + 0.15, y - 0.05, 0.4);\n    el('circle', { cx: l.x, cy: l.y, r: 1.4, fill: '#facc15', class: 'led', filter: 'url(#softGlow)' }, g);\n  }\n\n  // ----- Chimney -----\n  function chimney(g, x, y, baseZ, h = 0.9) {\n    box(g, x, y, baseZ, 0.45, 0.45, h, { top: '#3a3a42', right: '#2a2a30', left: '#33333a', sw: 0.4 });\n  }\n\n  // ----- Hedge / planter -----\n  function hedge(g, x, y, w, d) {\n    box(g, x, y, 0, w, d, 0.45, { top: '#3f6b3f', right: '#2c4d2c', left: '#345b34', sw: 0.4 });\n  }\n\n  // ----- Pathway / road segment -----\n  function pathSeg(g, x, y, w, d, color = '#243049') {\n    const p = (X, Y, Z) => iso(X, Y, Z);\n    poly([p(x, y, 0), p(x + w, y, 0), p(x + w, y + d, 0), p(x, y + d, 0)],\n      color, g, { stroke: 'rgba(40,55,90,0.6)', 'stroke-width': 0.4 });\n  }\n\n  // ----- Micro DC cabinet (visible inside a glowing opening) -----\n  function microDC(g, x, y, z = 0) {\n    box(g, x, y, z, 0.7, 0.45, 1.2, { top: '#0a1a0e', right: '#0d2614', left: '#10301a', sw: 0.4 });\n    const p = (X, Y, Z) => iso(X, Y, Z);\n    const a = p(x + 0.7, y + 0.45, z + 1.2), b = p(x + 0.7, y + 0.45, z);\n    const c = p(x, y + 0.45, z), d = p(x, y + 0.45, z + 1.2);\n    poly([a, b, c, d], 'url(#rackGlow)', g, { opacity: 1 });\n    for (let i = 0; i < 5; i++) {\n      const zz = z + 0.15 + i * 0.2;\n      const p1 = iso(x + 0.05, y + 0.451, zz), p2 = iso(x + 0.65, y + 0.451, zz);\n      el('line', { x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y, stroke: '#4ade80', 'stroke-width': 0.7, opacity: 0.95 }, g);\n      const ld = iso(x + 0.6, y + 0.451, zz + 0.06);\n      el('circle', { cx: ld.x, cy: ld.y, r: 1.0, fill: '#86ff8c', class: 'led', filter: 'url(#softGlow)' }, g);\n    }\n    const t = iso(x + 0.35, y + 0.22, z + 1.25);\n    el('circle', { cx: t.x, cy: t.y, r: 2.2, fill: '#86ff8c', class: 'node-pulse', filter: 'url(#softGlow)' }, g);\n  }\n\n  // ----- Cooling airflow streams -----\n  function airflow(g, x, y, z) {\n    const p1 = iso(x, y, z), p2 = iso(x - 1.2, y, z + 0.6), p3 = iso(x - 2.2, y, z + 1.2);\n    el('path', {\n      d: `M ${p1.x} ${p1.y} Q ${p2.x - 8} ${p2.y - 4} ${p3.x} ${p3.y}`,\n      fill: 'none', stroke: '#67e8f9', 'stroke-width': 2.5,\n      'stroke-linecap': 'round', opacity: 0.55,\n      'stroke-dasharray': '3 6', class: 'stream-slow', filter: 'url(#softGlow)'\n    }, g);\n  }\n\n  // ----- Floating tag -----\n  function tag(parent, sx, sy, text, color = '#67e8f9') {\n    const g = el('g', { transform: `translate(${sx}, ${sy})` }, parent);\n    const w = text.length * 6.3 + 18;\n    el('rect', { x: 0, y: -12, width: w, height: 20, rx: 10, fill: 'rgba(8,16,32,0.85)', stroke: color, 'stroke-width': 1 }, g);\n    el('circle', { cx: 9, cy: -2, r: 3, fill: color, filter: 'url(#softGlow)' }, g);\n    el('text', { x: 17, y: 2, fill: '#e8edf7', 'font-family': 'JetBrains Mono, monospace', 'font-size': 10, 'letter-spacing': '0.06em' }, g).textContent = text;\n    return g;\n  }\n\n  // =====================================================================\n  // POTSDAM MULTI-FAMILY HOUSE (Mehrfamilienhaus)\n  // =====================================================================\n  function drawPotsdamHouse(g, h) {\n    const { x, y, w, d, wall, stories } = h;\n    const wallColor = wall || '#e6d6b8';\n    const roofType = h.roofType || 'gable'; // 'gable' | 'mansard' | 'flat'\n    const storyH = 1.1;\n    const baseH = 0.55; // ground floor stucco band height\n    const upperH = stories * storyH - baseH;\n    const topZ = stories * storyH;\n\n    // Ground floor (slightly darker stucco)\n    box(g, x, y, 0, w, d, baseH, {\n      top: shade(wallColor, -0.04),\n      right: shade(wallColor, -0.24),\n      left: shade(wallColor, -0.14),\n      sw: 0.5,\n    });\n    // Base cornice\n    cornice(g, x, y, baseH, w, d, 0.1, shade(wallColor, 0.05));\n    // Upper floors\n    box(g, x, y, baseH + 0.1, w, d, upperH - 0.1, {\n      top: shade(wallColor, 0.07),\n      right: shade(wallColor, -0.18),\n      left: shade(wallColor, -0.06),\n      sw: 0.5,\n    });\n    // Top cornice\n    cornice(g, x, y, topZ - 0.12, w, d, 0.14, shade(wallColor, 0.08));\n\n    // ------- Windows on the two visible facades -------\n    // Front (max-y face)\n    const cols = Math.max(3, Math.floor(w / 0.85));\n    const winW = 0.42, winH = 0.7;\n    const cgap = (w - cols * winW) / (cols + 1);\n    // Side (max-x face)\n    const rcols = Math.max(2, Math.floor(d / 0.85));\n    const rgap = (d - rcols * winW) / (rcols + 1);\n\n    // Seeded \"lit window\" pattern based on building position\n    const seed = (Math.abs(x * 31 + y * 17) | 0) + (h.name ? h.name.charCodeAt(0) : 0);\n    const lit = (idx) => ((seed * 9301 + idx * 49297) % 233280) % 4 === 0;\n\n    for (let f = 0; f < stories; f++) {\n      const fz = f * storyH;\n      const winZ = fz + (f === 0 ? 0.7 : 0.32);\n      const winHF = f === 0 ? 0.6 : 0.65;\n      // front (max-y)\n      for (let c = 0; c < cols; c++) {\n        const wx = x + cgap + c * (winW + cgap);\n        drawWindow(g, wx, y + d, winZ, winW, winHF, 'maxy', { lit: lit(f * 10 + c) });\n        // shutters on first floor (decorative dark strips)\n        if (h.shutters && f > 0) {\n          const sh = 0.05;\n          const sx1 = iso(wx - sh, y + d, winZ);\n          const sx2 = iso(wx, y + d, winZ);\n          const sx3 = iso(wx, y + d, winZ + winHF);\n          const sx4 = iso(wx - sh, y + d, winZ + winHF);\n          poly([sx1, sx2, sx3, sx4], shade(wallColor, -0.35), g);\n          const rsx1 = iso(wx + winW, y + d, winZ);\n          const rsx2 = iso(wx + winW + sh, y + d, winZ);\n          const rsx3 = iso(wx + winW + sh, y + d, winZ + winHF);\n          const rsx4 = iso(wx + winW, y + d, winZ + winHF);\n          poly([rsx1, rsx2, rsx3, rsx4], shade(wallColor, -0.35), g);\n        }\n      }\n      // side (max-x)\n      for (let c = 0; c < rcols; c++) {\n        const wy = y + rgap + c * (winW + rgap);\n        drawWindow(g, x + w, wy, winZ, winW, winHF, 'maxx', { lit: lit(f * 10 + c + 100) });\n      }\n    }\n\n    // Door on front face, ground floor\n    {\n      const doorW = 0.45, doorH = 0.9;\n      const dx0 = x + w * 0.5 - doorW / 2;\n      const pa = iso(dx0, y + d, 0);\n      const pb = iso(dx0 + doorW, y + d, 0);\n      const pc = iso(dx0 + doorW, y + d, doorH);\n      const pd = iso(dx0, y + d, doorH);\n      poly([pa, pb, pc, pd], shade(wallColor, -0.4), g, { stroke: 'rgba(8,12,22,0.6)', 'stroke-width': 0.4 });\n      // arched fanlight\n      const fc = iso(dx0 + doorW * 0.5, y + d, doorH + 0.05);\n      el('ellipse', { cx: fc.x, cy: fc.y - 2, rx: 5, ry: 2.4, fill: '#f3d88a', opacity: 0.75 }, g);\n    }\n\n    // ------- Roof -------\n    if (roofType === 'gable') {\n      gableRoof(g, x, y, topZ, w, d, 0.9, {\n        fill: h.roofColor || 'url(#roofSlate)',\n        dark: shade('#2a2f3a', 0),\n        gable: shade(wallColor, 0.03),\n      });\n      // Chimneys for bigger buildings\n      if (w > 2.5) chimney(g, x + w * 0.78, y + d * 0.5 - 0.1, topZ + 0.4, 0.8);\n      if (w > 4) chimney(g, x + w * 0.22, y + d * 0.5 - 0.1, topZ + 0.4, 0.8);\n    } else if (roofType === 'mansard') {\n      mansardRoof(g, x, y, topZ, w, d, 0.95, {\n        fill: h.roofColor || 'url(#roofDark)',\n      });\n    } else {\n      // flat\n      box(g, x - 0.08, y - 0.08, topZ, w + 0.16, d + 0.16, 0.18, {\n        top: '#3a4256', right: '#23293a', left: '#2f3548', sw: 0.4,\n      });\n    }\n\n    // Solar panels (on flat roofs / mansards top)\n    if (h.solar) {\n      if (roofType === 'flat') {\n        solarArray(g, x + 0.3, y + 0.3, topZ + 0.19, w - 0.6, d - 0.6);\n      } else if (roofType === 'mansard') {\n        solarArray(g, x + 0.45, y + 0.45, topZ + 0.96, w - 0.9, d - 0.9);\n      } else {\n        // gable: tilted strip on front slope\n        const slopeZ0 = topZ + 0.1;\n        const slopeZ1 = topZ + 0.78;\n        const p = (X, Y, Z) => iso(X, Y, Z);\n        const a = p(x + 0.5, y + d * 0.5 + 0.12, slopeZ1);\n        const b = p(x + w - 0.5, y + d * 0.5 + 0.12, slopeZ1);\n        const c = p(x + w - 0.5, y + d - 0.25, slopeZ0);\n        const dd = p(x + 0.5, y + d - 0.25, slopeZ0);\n        poly([a, b, c, dd], 'url(#solarPattern)', g, { stroke: '#0c1f44', 'stroke-width': 0.4 });\n      }\n    }\n\n    // Cutaway micro DC opening on the max-x face at ground level\n    if (h.dc) {\n      const p = (X, Y, Z) => iso(X, Y, Z);\n      const op_w = 1.4, op_h = 1.05;\n      const ox = x + w, oy = y + d * 0.5 - op_w / 2;\n      const a = p(ox, oy, 0.02), b = p(ox, oy + op_w, 0.02);\n      const c = p(ox, oy + op_w, op_h), dd = p(ox, oy, op_h);\n      poly([a, b, c, dd], '#020a04', g, { stroke: '#4ade80', 'stroke-width': 0.8 });\n      microDC(g, x + w - 0.01, y + d * 0.5 - op_w / 2 + 0.32, 0);\n      airflow(g, x + w + 0.05, y + d * 0.5 - op_w / 2 + 0.6, 0.5);\n      // small \"MICRO DC\" plaque above opening\n      const pl = iso(x + w, y + d * 0.5, op_h + 0.06);\n      el('rect', { x: pl.x - 6, y: pl.y - 3, width: 12, height: 5, fill: '#4ade80', opacity: 0.95, rx: 1 }, g);\n    }\n\n    // EV charger\n    if (h.ev) evCharger(g, x + w + 0.45, y + d - 0.5);\n\n    // Anchor (top of building) for streams\n    if (h.dc) {\n      const anchorZ = topZ + (roofType === 'gable' ? 0.9 : roofType === 'mansard' ? 0.95 : 0.2) + 0.1;\n      const top = iso(x + w * 0.5, y + d * 0.5, anchorZ);\n      return { sx: top.x, sy: top.y, name: h.name };\n    }\n    return null;\n  }\n\n  // =====================================================================\n  // NIKOLAIKIRCHE (Potsdam landmark — green dome)\n  // =====================================================================\n  function drawNikolaikirche(g, cx, cy) {\n    // Footprint approx 5x5, centered on (cx, cy)\n    const w = 4.4, d = 4.4;\n    const x = cx - w / 2, y = cy - d / 2;\n    const wallColor = '#ece1c8';\n\n    // Stylobate / plinth (ground band)\n    box(g, x - 0.15, y - 0.15, 0, w + 0.3, d + 0.3, 0.35, {\n      top: shade(wallColor, -0.1), right: shade(wallColor, -0.28), left: shade(wallColor, -0.18), sw: 0.45,\n    });\n    // Main cubic body\n    box(g, x, y, 0.35, w, d, 2.6, {\n      top: shade(wallColor, 0.04), right: shade(wallColor, -0.16), left: shade(wallColor, -0.04), sw: 0.5,\n    });\n    // Pilasters: vertical strips on max-y face\n    const pilCount = 5;\n    for (let i = 0; i <= pilCount; i++) {\n      const px = x + (i / pilCount) * w;\n      const p1 = iso(px - 0.05, y + d, 0.35);\n      const p2 = iso(px + 0.05, y + d, 0.35);\n      const p3 = iso(px + 0.05, y + d, 2.6);\n      const p4 = iso(px - 0.05, y + d, 2.6);\n      poly([p1, p2, p3, p4], shade(wallColor, -0.1), g, { 'stroke-width': 0 });\n    }\n    // Tall windows on max-y face\n    for (let i = 0; i < pilCount; i++) {\n      const wx = x + (i + 0.5) / pilCount * w - 0.18;\n      drawWindow(g, wx, y + d, 1.0, 0.36, 1.3, 'maxy', { glass: '#2a3a55', frame: 'rgba(20,28,44,0.6)' });\n    }\n    // Pilasters + windows on max-x face\n    for (let i = 0; i <= pilCount; i++) {\n      const py = y + (i / pilCount) * d;\n      const p1 = iso(x + w, py - 0.05, 0.35);\n      const p2 = iso(x + w, py + 0.05, 0.35);\n      const p3 = iso(x + w, py + 0.05, 2.6);\n      const p4 = iso(x + w, py - 0.05, 2.6);\n      poly([p1, p2, p3, p4], shade(wallColor, -0.1), g, { 'stroke-width': 0 });\n    }\n    for (let i = 0; i < pilCount; i++) {\n      const wy = y + (i + 0.5) / pilCount * d - 0.18;\n      drawWindow(g, x + w, wy, 1.0, 0.36, 1.3, 'maxx', { glass: '#2a3a55' });\n    }\n\n    // Top cornice / entablature\n    cornice(g, x, y, 2.6, w, d, 0.2, shade(wallColor, 0.06));\n\n    // Attic block (slightly smaller, square)\n    const aIn = 0.45;\n    box(g, x + aIn, y + aIn, 2.85, w - 2 * aIn, d - 2 * aIn, 0.7, {\n      top: shade(wallColor, 0.03), right: shade(wallColor, -0.18), left: shade(wallColor, -0.06), sw: 0.45,\n    });\n    // Drum (smaller octagonal-ish — drawn as a square footprint with cornice on top)\n    const drIn = 0.95;\n    const drZ0 = 3.55;\n    const drW = w - 2 * drIn;\n    const drD = d - 2 * drIn;\n    box(g, x + drIn, y + drIn, drZ0, drW, drD, 1.1, {\n      top: shade(wallColor, 0.0), right: shade(wallColor, -0.2), left: shade(wallColor, -0.08), sw: 0.45,\n    });\n    // Drum windows (small round arched)\n    const drCols = 3;\n    for (let i = 0; i < drCols; i++) {\n      const dwx = x + drIn + (i + 0.5) / drCols * drW - 0.14;\n      drawWindow(g, dwx, y + d - drIn, drZ0 + 0.35, 0.28, 0.5, 'maxy', { glass: '#2a3a55' });\n    }\n    for (let i = 0; i < drCols; i++) {\n      const dwy = y + drIn + (i + 0.5) / drCols * drD - 0.14;\n      drawWindow(g, x + w - drIn, dwy, drZ0 + 0.35, 0.28, 0.5, 'maxx', { glass: '#2a3a55' });\n    }\n    cornice(g, x + drIn, y + drIn, drZ0 + 1.1, drW, drD, 0.15, shade(wallColor, 0.05));\n\n    // DOME (green hemisphere)\n    const domeBaseZ = drZ0 + 1.25;\n    const domeR = (drW + drD) / 4 + 0.05;\n    // base ring\n    const ringP = iso(cx, cy, domeBaseZ);\n    el('ellipse', {\n      cx: ringP.x, cy: ringP.y,\n      rx: domeR * S * 0.866, ry: domeR * S * 0.5,\n      fill: shade(PT_GREEN_DARK, -0.1),\n      stroke: 'rgba(8,12,22,0.5)', 'stroke-width': 0.8,\n    }, g);\n    // dome body (rounded — drawn as a tall ellipse + foreshortened cap)\n    const domeTopZ = domeBaseZ + domeR * 1.05;\n    const domeCenter = iso(cx, cy, (domeBaseZ + domeTopZ) / 2);\n    // Use a path that combines a half-ellipse (top) with a flat-ish bottom along the iso ring.\n    // Approximation: an ellipse vertically taller than wide, with a clip-line at base.\n    const rx = domeR * S * 0.95;\n    const ry = (domeR * S) * 1.05; // tall\n    // We draw a path: top semi-ellipse + bottom iso-ring arc\n    const baseRx = domeR * S * 0.866;\n    const baseRy = domeR * S * 0.5;\n    const path = [\n      `M ${ringP.x - baseRx} ${ringP.y}`,\n      `A ${rx} ${ry} 0 0 1 ${ringP.x + baseRx} ${ringP.y}`,\n      `A ${baseRx} ${baseRy} 0 0 1 ${ringP.x - baseRx} ${ringP.y}`,\n      'Z',\n    ].join(' ');\n    el('path', { d: path, fill: 'url(#domeGreen)', stroke: 'rgba(20,40,20,0.5)', 'stroke-width': 0.8 }, g);\n    // Subtle highlight crescent on upper-left\n    el('ellipse', {\n      cx: ringP.x - rx * 0.25, cy: ringP.y - ry * 0.55,\n      rx: rx * 0.45, ry: ry * 0.3,\n      fill: shade(PT_GREEN, 0.12), opacity: 0.55,\n    }, g);\n\n    // Lantern on top\n    const lanternBaseZ = domeTopZ;\n    const lp = iso(cx, cy, lanternBaseZ);\n    el('rect', { x: lp.x - 6, y: lp.y - 22, width: 12, height: 22, fill: shade(wallColor, -0.05), stroke: 'rgba(8,12,22,0.5)', 'stroke-width': 0.5 }, g);\n    el('rect', { x: lp.x - 4, y: lp.y - 19, width: 8, height: 14, fill: '#3a4d6b', opacity: 0.8 }, g);\n    // tiny dome on lantern\n    el('ellipse', { cx: lp.x, cy: lp.y - 23, rx: 7, ry: 3, fill: PT_GREEN_DARK, stroke: 'rgba(8,12,22,0.5)', 'stroke-width': 0.4 }, g);\n    el('ellipse', { cx: lp.x, cy: lp.y - 27, rx: 7, ry: 6, fill: 'url(#domeGreen)', stroke: 'rgba(8,12,22,0.5)', 'stroke-width': 0.4 }, g);\n    // Cross (small)\n    el('line', { x1: lp.x, y1: lp.y - 30, x2: lp.x, y2: lp.y - 44, stroke: '#d4c8a8', 'stroke-width': 1.2 }, g);\n    el('line', { x1: lp.x - 4, y1: lp.y - 38, x2: lp.x + 4, y2: lp.y - 38, stroke: '#d4c8a8', 'stroke-width': 1.2 }, g);\n\n    // Portico on front (max-y face): smaller stepped block with 4 columns\n    const poW = w - 1.4, poD = 0.7;\n    const poX = x + 0.7, poY = y + d;\n    box(g, poX, poY, 0, poW, poD, 0.25, {\n      top: shade(wallColor, -0.08), right: shade(wallColor, -0.24), left: shade(wallColor, -0.16), sw: 0.4,\n    });\n    // 4 columns\n    const colN = 4;\n    for (let i = 0; i < colN; i++) {\n      const ccx = poX + 0.2 + (i / (colN - 1)) * (poW - 0.4) - 0.12;\n      box(g, ccx, poY + 0.15, 0.25, 0.24, 0.24, 1.5, {\n        top: shade(wallColor, 0.06), right: shade(wallColor, -0.14), left: shade(wallColor, -0.04), sw: 0.3,\n      });\n    }\n    // Pediment beam\n    box(g, poX, poY, 1.75, poW, poD, 0.25, {\n      top: shade(wallColor, 0.04), right: shade(wallColor, -0.14), left: shade(wallColor, -0.04), sw: 0.4,\n    });\n\n    // Plaza area: tiles in front\n    const plzX = x - 0.8, plzY = y + d + 0.05;\n    pathSeg(g, plzX, plzY, w + 1.6, 1.3, '#2c3853');\n\n    // Trees flanking\n    tree(g, x - 0.6, y + d + 0.6, 1.0);\n    tree(g, x + w + 0.6, y + d + 0.6, 1.0);\n\n    // Anchor for data stream from landmark (just for flavor; not a DC node)\n    return { sx: ringP.x, sy: ringP.y - ry * 0.6, name: 'NIKOLAIKIRCHE', landmark: true };\n  }\n\n  // =====================================================================\n  // SCENE BUILDOUT\n  // =====================================================================\n  // Roads\n  const RMIN = -8, RMAX = 8;\n  // Cobblestone-ish main road (horizontal, in x direction)\n  pathSeg(gNeigh, RMIN, -0.9, RMAX - RMIN, 1.8, '#1d2640');\n  // Cross road\n  pathSeg(gNeigh, -0.9, RMIN, 1.8, RMAX - RMIN, '#1d2640');\n  // Centerline\n  pathSeg(gNeigh, RMIN, -0.04, RMAX - RMIN, 0.08, '#2e3a5a');\n  pathSeg(gNeigh, -0.04, RMIN, 0.08, RMAX - RMIN, '#2e3a5a');\n  // Sidewalks\n  pathSeg(gNeigh, RMIN, -1.15, RMAX - RMIN, 0.25, '#283251');\n  pathSeg(gNeigh, RMIN, 0.9, RMAX - RMIN, 0.25, '#283251');\n  pathSeg(gNeigh, -1.15, RMIN, 0.25, RMAX - RMIN, '#283251');\n  pathSeg(gNeigh, 0.9, RMIN, 0.25, RMAX - RMIN, '#283251');\n\n  // Potsdam-style multi-family houses (Mehrfamilienhäuser, 3-4 stories)\n  // Pastel facade palette common in Brandenburg/Potsdam\n  const houses = [\n    // Back row (y most negative — furthest in iso)\n    { x: -7.2, y: -7.4, w: 3.4, d: 2.6, stories: 3, wall: '#e8d2b0', roofType: 'gable', roofColor: 'url(#roofSlate)', shutters: true, name: 'CPT-01', dc: true },\n    { x: 4.4,  y: -7.4, w: 3.2, d: 2.6, stories: 4, wall: '#cdb88c', roofType: 'mansard', name: 'CPT-02', dc: true, solar: true },\n\n    // Mid-back row (between landmark and back)\n    { x: -7.2, y: -3.2, w: 3.0, d: 2.4, stories: 3, wall: '#c8d2bc', roofType: 'gable', roofColor: 'url(#roofSlate)', shutters: true, name: 'CPT-03', dc: true },\n    { x: 4.2,  y: -3.2, w: 3.3, d: 2.4, stories: 3, wall: '#d6b8a8', roofType: 'gable', roofColor: 'url(#roofSlate)', name: 'CPT-04', ev: true },\n\n    // Front of road (positive y)\n    { x: -7.2, y: 2.2, w: 3.2, d: 2.6, stories: 4, wall: '#dec5d0', roofType: 'mansard', solar: true, name: 'CPT-05', dc: true },\n    { x: -2.4, y: 2.2, w: 3.2, , 'letter-spacing': '0.1em' }, opG2).textContent = s.l.toUpperCase();\n    el('text', { x: xx + 6, y: yy + 30, fill: s.c, 'font-family': 'Manrope, sans-serif', 'font-size': 13, 'font-weight': 600 }, opG2).textContent = s.v;\n  });\n\n  // Node strip\n  for (let i = 0; i < 12; i++) {\n    el('rect', { x: -130 + i * 22, y: 96, width: 18, height: 8, rx: 1.5, fill: i === 4 ? '#facc15' : '#34d399', opacity: 0.85, filter: 'url(#softGlow)' }, opG2);\n  }\n  el('text', { x: -130, y: 116, fill: '#5a6c93', 'font-family': 'JetBrains Mono, monospace', 'font-size': 8, 'letter-spacing': '0.1em' }, opG2).textContent = '12 NODES · 1 SCHEDULED MAINT';\n\n  // Floating callout\n  tag(gOp, opX + 40, opY - 150, 'JOBS · TELEMETRY · BILLING', '#a78bfa');\n\n  // ====================================================================\n  // THICK CONNECTION (bi-directional) cloud <-> operator\n  // ====================================================================\n  const cx_anchor = cloudCx + 560;\n  const cy_anchor = cloudCy;\n  const dx_anchor = opX;\n  const dy_anchor = opY - 100;\n\n  const thickPath = `M ${cx_anchor} ${cy_anchor} C ${cx_anchor + 130} ${cy_anchor}, ${dx_anchor - 130} ${dy_anchor - 60}, ${dx_anchor} ${dy_anchor}`;\n\n  // outer glow\n  el('path', { d: thickPath, fill: 'none', stroke: '#22d3ee', 'stroke-width': 14, opacity: 0.22, filter: 'url(#bigGlow)' }, gThick);\n  // outbound (to operator) — cyan\n  el('path', {\n    d: thickPath, fill: 'none', stroke: 'url(#thickStream)', 'stroke-width': 5,\n    'stroke-linecap': 'round', 'stroke-dasharray': '10 14', class: 'stream',\n  }, gThick);\n  // inbound (from operator back to cloud) — green, offset path\n  const thickPath2 = `M ${dx_anchor} ${dy_anchor + 14} C ${dx_anchor - 130} ${dy_anchor - 40}, ${cx_anchor + 130} ${cy_anchor + 24}, ${cx_anchor} ${cy_anchor + 14}`;\n  el('path', { d: thickPath2, fill: 'none', stroke: PT_GREEN, 'stroke-width': 8, opacity: 0.18, filter: 'url(#bigGlow)' }, gThick);\n  el('path', {\n    d: thickPath2, fill: 'none', stroke: 'url(#thickGreen)', 'stroke-width': 3.5,\n    'stroke-linecap': 'round', 'stroke-dasharray': '8 12', class: 'stream-down',\n  }, gThick);\n\n  el('circle', { cx: cx_anchor, cy: cy_anchor, r: 6, fill: '#22d3ee', class: 'node-pulse', filter: 'url(#softGlow)' }, gThick);\n  el('circle', { cx: dx_anchor, cy: dy_anchor, r: 5, fill: '#a5f3fc', filter: 'url(#softGlow)' }, gThick);\n\n  // Labels for direction\n  el('text', {\n    x: (cx_anchor + dx_anchor) / 2, y: (cy_anchor + dy_anchor) / 2 - 28,\n    fill: '#a5f3fc', 'text-anchor': 'middle', 'font-family': 'JetBrains Mono, monospace',\n    'font-size': 11, 'letter-spacing': '0.18em',\n  }, gThick).textContent = '◀ JOBS  TELEMETRY ▶';\n  el('text', {\n    x: (cx_anchor + dx_anchor) / 2, y: (cy_anchor + dy_anchor) / 2 - 12,\n    fill: '#7a9a64', 'text-anchor': 'middle', 'font-family': 'JetBrains Mono, monospace',\n    'font-size': 9, 'letter-spacing': '0.12em',\n  }, gThick).textContent = 'UNIFIED API';\n\n  // ====================================================================\n  // Callouts in scene\n  // ====================================================================\n  function calloutFor(worldX, worldY, worldZ, label, color, dx = 60, dy = -40) {\n    const p = iso(worldX, worldY, worldZ);\n    el('line', { x1: p.x, y1: p.y, x2: p.x + dx - 4, y2: p.y + dy + 4, stroke: color, 'stroke-width': 0.8, opacity: 0.7, 'stroke-dasharray': '2 3' }, gStreams);\n    el('circle', { cx: p.x, cy: p.y, r: 2.5, fill: color, filter: 'url(#softGlow)' }, gStreams);\n    tag(gStreams, p.x + dx, p.y + dy, label, color);\n  }\n  // Landmark callout removed per request\n  // calloutFor(0.7, -5.3, 6.2, 'NIKOLAIKIRCHE  ·  POTSDAM', PT_GREEN, -340, -36);\n  // Roof PV callout\n  calloutFor(-7.2 + 1.5, 2.2 + 1.3, 5.0, 'ROOFTOP PV', '#facc15', -240, -28);\n  // GPU node callout\n  calloutFor(2.5 + 1.7, 5.8 + 1.3, 5.0, '10× GPU NODE', '#86ff8c', 60, -60);\n\n})();\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>
